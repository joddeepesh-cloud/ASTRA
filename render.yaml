# Render Blueprint Infrastructure-as-Code for ASTRA Backend (Judge Profile)
services:
  - type: web
    name: astra-backend
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements-render-judge.txt
    startCommand: gunicorn -c deploy/gunicorn.conf.py backend.app.main:app
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: ASTRA_DEPLOYMENT_MODE
        value: "judge"
      - key: HF_HUB_OFFLINE
        value: "1"
      - key: ASTRA_DEVICE
        value: "cpu"
      - key: ALLOWED_ORIGINS
        value: '["https://3e63a302.astra-3ll.pages.dev", "https://bdb22d8c.astra-3ll.pages.dev", "https://astra-3ll.pages.dev", "https://astra.pages.dev", "http://localhost:5173"]'
      - key: FRONTEND_ORIGIN
        value: "https://3e63a302.astra-3ll.pages.dev"
    healthCheckPath: /api/v1/health
